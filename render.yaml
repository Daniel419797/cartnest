# Preview API profile. The Next.js storefront is deployed separately to Vercel.
# Supabase PostgreSQL is configured manually as DATABASE_URL and is never committed.
# The API and worker intentionally share this free Render web instance because
# Render's free tier has no dedicated background-worker service.
services:
  - type: web
    name: cartnest-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./deploy/docker/Dockerfile.render
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_BASE_URL
        sync: false
      - key: API_PUBLIC_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      # Optional but recommended for migrations when DATABASE_URL uses a transaction pooler.
      # Render is IPv4-only; with Supabase use the Supavisor Session pooler URL on port 5432.
      # Do not use db.<project-ref>.supabase.co here unless the Supabase IPv4 add-on is enabled.
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cartnest-preview-queue
          property: connectionString
      # Required for verification and password-reset email delivery. Configure
      # these as secrets in Render; do not commit their values.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: keyvalue
    name: cartnest-preview-queue
    plan: free
    region: frankfurt
    maxmemoryPolicy: noeviction
    ipAllowList: []
