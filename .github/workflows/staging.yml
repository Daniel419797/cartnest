name: Staging Release

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Build, publish, and deploy to the staging host
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: cartnest-staging
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:scan
      - run: pnpm security:audit
      - run: pnpm lint
      - run: pnpm db:validate
      - run: pnpm api:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm docs:check
      - run: pnpm p12:preflight

  images:
    if: ${{ inputs.deploy }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [web, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cartnest-${{ matrix.service }}:${{ github.sha }}

  deploy:
    if: ${{ inputs.deploy }}
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.sha }}
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cartnest-web:${{ github.sha }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/cartnest-api:${{ github.sha }}
      WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/cartnest-worker:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure staging SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload immutable release compose
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          release_dir="/opt/cartnest/releases/${RELEASE_SHA}"
          ssh "${STAGING_USER}@${STAGING_HOST}" "mkdir -p '${release_dir}' /opt/cartnest/state"
          scp deploy/staging/compose.release.yaml "${STAGING_USER}@${STAGING_HOST}:${release_dir}/compose.yaml"
          scp deploy/staging/Caddyfile "${STAGING_USER}@${STAGING_HOST}:${release_dir}/Caddyfile"
      - name: Migrate and deploy staging candidate
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            "RELEASE_SHA='${RELEASE_SHA}' WEB_IMAGE='${WEB_IMAGE}' API_IMAGE='${API_IMAGE}' WORKER_IMAGE='${WORKER_IMAGE}' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="/opt/cartnest/releases/${RELEASE_SHA}"
          env_file="/opt/cartnest/env/staging.env"
          test -f "$env_file"
          cd "$release_dir"
          umask 077
          cat > .release.env <<EOF
          RELEASE_SHA=${RELEASE_SHA}
          RELEASE_DIR=${release_dir}
          WEB_IMAGE=${WEB_IMAGE}
          API_IMAGE=${API_IMAGE}
          WORKER_IMAGE=${WORKER_IMAGE}
          EOF
          ln -sfn "$release_dir" /opt/cartnest/candidate
          export STAGING_ENV_FILE="$env_file"
          export WEB_IMAGE API_IMAGE WORKER_IMAGE
          docker compose --env-file "$env_file" -f compose.yaml pull
          docker compose --env-file "$env_file" -f compose.yaml --profile migration run --rm migrate
          docker compose --env-file "$env_file" -f compose.yaml up -d --remove-orphans
          REMOTE
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Staging smoke test and evidence
        env:
          STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          RELEASE_SHA: ${{ github.sha }}
        run: pnpm p12:smoke
      - name: Promote smoke-passed staging release
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          ssh "${STAGING_USER}@${STAGING_HOST}" \
            "RELEASE_SHA='${RELEASE_SHA}' bash -s" <<'REMOTE'
          set -euo pipefail
          release_dir="/opt/cartnest/releases/${RELEASE_SHA}"
          test -f "$release_dir/.release.env"
          ln -sfn "$release_dir" /opt/cartnest/current
          cp "$release_dir/.release.env" /opt/cartnest/state/last-good.env
          rm -f /opt/cartnest/candidate
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-staging-evidence-${{ github.sha }}
          path: artifacts/p12
          if-no-files-found: warn
