name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: install-security-lint-codegen-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Scan repository for committed secrets
        run: pnpm security:scan
      - name: Audit dependencies for high/critical advisories
        run: pnpm security:audit
      - name: Lint and architecture boundaries
        run: pnpm lint
      - name: Validate Prisma schema
        run: pnpm db:validate
      - name: Regenerate OpenAPI and typed client
        run: pnpm api:generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Check documentation links
        run: pnpm docs:check
